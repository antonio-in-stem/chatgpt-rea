[package]
name = "native-workspace"
version.workspace = true
edition.workspace = true
[dependencies]
native-ui = { path = "../native-ui" }
gpui-kit = "=0.7.3"
serde_json = "1"
chrono = "0.4.45"
native-core = { path = "../native-core" }
native-settings = { path = "../native-settings" }
native-rich = { path = "../native-rich" }
native-tools = { path = "../native-tools" }

[features]
ui-tests = ["gpui-kit/test-support"]

[build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization"] }
