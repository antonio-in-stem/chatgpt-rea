<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Web content preview</title><style>*{box-sizing:border-box}body{margin:0;background:#181818;color:#eee;font:14px system-ui}nav{height:62px;display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #414141}button,input{background:#292929;border:1px solid #454545;border-radius:9px;color:#eee;padding:9px 14px}button:hover{background:#414141}button:disabled{opacity:.35}input{flex:1}iframe{width:100%;height:calc(100vh - 93px);border:0;background:#faf9f6}footer{height:31px;padding:6px 15px;color:#aaa}#status{margin-left:auto}</style><nav><button id="back" aria-label="Back">←</button><button id="forward" aria-label="Forward">→</button><button id="reload">Reload</button><input id="address" aria-label="Preview address" value="demo://home"><button id="go">Go</button></nav><iframe id="page" title="Local demo content" sandbox="allow-scripts"></iframe><footer>WebView2 · Local interactive content <span id="status"></span></footer><script>
const pages={home:`<h1>A place for your ideas.</h1><p>This content is rendered by Windows WebView2 inside a Rust host.</p><button onclick="parent.postMessage('demo://notes','*')">Open notes →</button><button onclick="parent.postMessage('demo://dashboard','*')">Explore dashboard →</button>`,notes:`<h1>Notes</h1><p>A real editable web content preview. Edits remain until you navigate.</p><textarea aria-label="Notes" style="width:100%;height:260px;padding:18px;font:18px system-ui;border:1px solid #ccc;border-radius:12px">Plan the next launch.\nReview the design.\nShare the prototype.</textarea>`,dashboard:`<h1>Project dashboard</h1><p>Interact with the preview.</p><div class="card"><strong id="count">12</strong> tasks completed</div><button onclick="document.getElementById('count').textContent=+document.getElementById('count').textContent+1">Complete a task</button><button onclick="document.body.style.background=document.body.style.background?'':'#e4f2ed'">Change appearance</button>`};
let history=['demo://home'],index=0;const $=s=>document.getElementById(s);function render(){const url=history[index];$('address').value=url;const key=url.replace('demo://','');$('page').srcdoc='<style>body{margin:60px auto;max-width:720px;padding:24px;color:#232323;font:18px system-ui;background:#faf9f6}h1{font-size:48px;letter-spacing:-2px}button{padding:12px 20px;border:0;border-radius:10px;background:#222;color:white;margin:8px 8px 8px 0;cursor:pointer}.card{border:1px solid #ddd;border-radius:16px;padding:30px;margin:24px 0}strong{font-size:42px}</style>'+pages[key];$('back').disabled=index===0;$('forward').disabled=index===history.length-1;$('status').textContent='Loaded '+url;}function go(url){if(!['demo://home','demo://notes','demo://dashboard'].includes(url)){$('status').textContent='Use demo://home, demo://notes or demo://dashboard';return}history=history.slice(0,index+1);history.push(url);index++;render()}$('go').onclick=()=>go($('address').value.trim());$('address').onkeydown=e=>{if(e.key==='Enter')go(e.target.value.trim())};$('back').onclick=()=>{if(index>0){index--;render()}};$('forward').onclick=()=>{if(index<history.length-1){index++;render()}};$('reload').onclick=render;addEventListener('message',e=>{if(e.source===$('page').contentWindow&&typeof e.data==='string')go(e.data)});render();</script></html>
